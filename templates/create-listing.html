{% extends "base.html" %}

<h1>

{% if editing %}

Edit Listing

{% else %}

Create Listing

{% endif %}

</h1>

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/create-listing.css') }}">
{% endblock %}

{% block content %}

<section class="listing-page">

    <div class="listing-card">

            <form
                action="{% if editing %}
                    {{ url_for('auction.edit_listing', item_id=item.item_id) }}
                {% else %}
                    {{ url_for('auction.create_listing') }}
                {% endif %}"
                    method="POST"
                    enctype="multipart/form-data">

            <div class="upload-panel">

                <h2>Upload Photos</h2>

                <label class="upload-box" id="dropArea">

                    <input
                        id="imageInput"
                        name="images"
                        type="file"
                        multiple
                        accept="image/*"
                        hidden>

                    <div class="upload-content">

                        <div class="upload-icon">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 width="75"
                                 height="75"
                                 fill="currentColor"
                                 class="bi bi-cloud-arrow-down"
                                 viewBox="0 0 16 16">

                                <path fill-rule="evenodd"
                                      d="M7.646 10.854a.5.5 0 0 0 .708 0l2-2a.5.5 0 0 0-.708-.708L8.5 9.293V5.5a.5.5 0 0 0-1 0v3.793L6.354 8.146a.5.5 0 1 0-.708.708z"/>

                                <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383m.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>

                            </svg>

                        </div>

                        <h3>Drag & Drop Images</h3>

                        <p>or click to browse</p>

                        <small>JPG • PNG • WEBP</small>

                    </div>

                </label>

                <p id="imageCount">
                    No images selected
                </p>

                <div
                    class="preview-grid"
                    id="previewGrid">
                </div>

            </div>

            <div class="details-panel">

                <h2>Create Auction</h2>

                <div class="form-group">

                    <label>Item Title</label>

                    <input
                        type="text"
                        name="title"
                        value="{{ item.title if editing else '' }}"
                        required>

                </div>

                <div class="two-columns">

                    <div class="form-group">

                        <label>Category</label>

                        <select
                            name="category"
                            required>

                            {% for category in categories %}

                            <option
                                value="{{ category.category_id }}"

                                {% if editing and item.category_id == category.category_id %}
                                selected
                                {% endif %}>

                                {{ category.category_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Condition</label>

                        <select
                            name="condition"
                            required>

                            <option value="new">        New         </option>
                            <option value="like_new">   Like New    </option>
                            <option value= "used">      Used        </option>

                            <option
                                value="new"

                                {% if editing and item.item_condition=="new" %}
                                selected
                                {% endif %}>

                                New

                            </option>

                            <option
                                value="like_new"

                                {% if editing and item.item_condition=="like_new" %}
                                selected
                                {% endif %}>

                                Like New

                            </option>

                            <option
                                value="used"

                                {% if editing and item.item_condition=="used" %}
                                selected
                                {% endif %}>

                                Used

                            </option>

                        </select>

                    </div>

                </div>

                <div class="two-columns">

                    <div class="form-group">

                        <label>Starting Price</label>

                        <div class="price-input">

                            <span>₱</span>

                            <input
                                type="number"
                                name="price"
                                step="0.01"
                                value="{{ item.starting_price if editing else '' }}"
                                required>

                        </div>

                    </div>

                    <div class="form-group">

                        <label>Auction Ends</label>

                        <input
                            type="datetime-local"
                            name="auction_end"
                            value="{{ item.auction_end.strftime('%Y-%m-%dT%H:%M') if editing else '' }}"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        name="description"
                        rows="7"
                        placeholder="Describe your item..."
                        required>{{ item.description if editing else '' }}
                    </textarea>

                </div>

                <label class="checkbox">

                    <input
                        type="checkbox"
                        name="donate"
                        {% if editing and item.donate_to_nstp %}
                        checked
                    {% endif %}>

                    Donate part of the proceeds to NSTP

                </label>

                <button
                    class="publish-btn"
                    type="submit">

                    Publish Auction

                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/create-listing.js') }}"></script>
{% endblock %}
