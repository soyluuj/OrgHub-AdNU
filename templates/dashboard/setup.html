{% extends "base.html" %}

{% block title %}Setup Organization | OrgHub{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2 style="color: #003366; margin-bottom: 10px;">Setup Your Organization</h2>
    <p style="color: #666; margin-bottom: 20px;">Create your official page on OrgHub to start posting announcements and merch.</p>
    
    <form method="POST">
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="font-weight: 600; display: block; margin-bottom: 5px;">Organization Name</label>
            <input type="text" name="name" placeholder="e.g., Computer Science Society" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label style="font-weight: 600; display: block; margin-bottom: 5px;">Category</label>
            <select name="category" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="" disabled selected>Select a category</option>
                <option value="curricular">Curricular</option>
                <option value="extra-curricular">Extra-Curricular</option>
                <option value="department">Department</option>
            </select>
        </div>

        <button type="submit" style="width: 100%; background: #003366; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">
            Create Profile
        </button>
    </form>
</div>
{% endblock %}
