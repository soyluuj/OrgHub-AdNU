{% extends "base.html" %}
{% block title %}Settings | {{ org.name }}{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h2>Edit Organization Profile</h2>
    <p><a href="{{ url_for('dashboard.index') }}">&larr; Back to Dashboard</a></p>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Organization Name</label>
            <input type="text" name="name" value="{{ org.name }}" required>
        </div>

        <div class="form-group">
            <label>Bio / Description</label>
            <textarea name="bio" rows="5" placeholder="Tell students about your org...">{{ org.bio or '' }}</textarea>
        </div>

        <div class="form-group">
            <label>Logo (Square image recommended)</label>
            {% if org.logo_url %}
                <div style="margin-bottom: 10px;">
                    <img src="{{ url_for('static', filename=org.logo_url) }}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">
                </div>
            {% endif %}
            <input type="file" name="logo" accept="image/*">
        </div>

        <div class="form-group">
            <label>Cover Image (Wide image recommended)</label>
            {% if org.cover_image_url %}
                <div style="margin-bottom: 10px;">
                    <img src="{{ url_for('static', filename=org.cover_image_url) }}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px;">
                </div>
            {% endif %}
            <input type="file" name="cover" accept="image/*">
        </div>

        <button type="submit">Save Changes</button>
    </form>
</div>
{% endblock %}
