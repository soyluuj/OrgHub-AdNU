{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 20px 0;">
    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 500px; border: 1px solid var(--border-color);">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="color: var(--primary-blue); font-size: 28px; margin-bottom: 5px;">Create an Account</h2>
            <p style="color: var(--text-light); font-size: 14px;">Join the central hub for AdNU organizations</p>
        </div>

        <form method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-dark);">Full Name</label>
                <input type="text" name="fullname" placeholder="Juan Dela Cruz" required>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-dark);">Email Address</label>
                <input type="email" name="email" placeholder="student@adnu.edu.ph" required>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-dark);">Password</label>
                <input type="password" name="password" placeholder="Create a strong password" required>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-dark);">I am registering as a...</label>
                <select name="role" required style="width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 6px; font-family: 'Poppins', sans-serif;">
                    <option value="student">Student</option>
                    <option value="org_admin">Organization Admin</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">Create Account</button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-light);">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--primary-blue);">Log in here</a>
        </div>
        
    </div>
</div>
{% endblock %}
