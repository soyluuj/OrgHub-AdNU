{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid var(--border-color);">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="color: var(--primary-blue); font-size: 28px; margin-bottom: 5px;">Welcome Back</h2>
            <p style="color: var(--text-light); font-size: 14px;">Log in to your OrgHub account</p>
        </div>

        <form method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-dark);">Email Address</label>
                <input type="email" name="email" placeholder="student@adnu.edu.ph" required>
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-dark);">Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">Log In</button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-light);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600; color: var(--primary-blue);">Sign up here</a>
        </div>
        
    </div>
</div>
{% endblock %}
